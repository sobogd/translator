# Reference nginx server block for translate.iq-factura.com
# Place on prod as /etc/nginx/sites-available/translator (symlink to sites-enabled),
# then: nginx -t && systemctl reload nginx
# TLS lines below are added automatically by: certbot --nginx -d translate.iq-factura.com

server {
    listen 80;
    server_name translate.iq-factura.com;

    # Next.js (translator) running under PM2 on port 8200
    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 25m; # allow WAV uploads
}
