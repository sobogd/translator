# Reference nginx server blocks for iq-translate.com (prod: /etc/nginx/sites-available/iq-translate.conf,
# symlinked into sites-enabled). Reload with: nginx -t && systemctl reload nginx
# Cert: certbot certonly --webroot -w /var/www/letsencrypt -d iq-translate.com -d www.iq-translate.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iq-translate.com;

    ssl_certificate /etc/letsencrypt/live/iq-translate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iq-translate.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M; # allow WAV uploads

    # HSTS: the apex + www already redirect every plain-HTTP hit to TLS, this
    # stops the first redirect from happening at all on repeat visits.
    # (Shared server — this block only covers iq-translate.com.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Brotli is enabled server-wide in /etc/nginx/conf.d/brotli.conf, loaded by
    # /etc/nginx/modules-enabled/50-mod-http-brotli.conf. Ubuntu ships no arm64
    # brotli module for nginx 1.18, so the two .so files were built from source
    # on the box (/usr/local/src/brotli-build, nginx 1.18.0 + google/ngx_brotli,
    # `./configure --with-compat --add-dynamic-module=../ngx_brotli && make
    # modules`). They must be rebuilt if nginx ever moves off 1.18.x, otherwise
    # nginx refuses to start.

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Next.js (translator) running under PM2 on port 8200
    location / {
        proxy_pass http://127.0.0.1:8200;
        # Ask Next for uncompressed output so nginx can apply brotli here;
        # otherwise Next gzips first and the response can no longer be
        # recompressed. Measured: home page 23.8 kB gzip -> 15.7 kB brotli.
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Geo for the cookieless analytics (lib/analytics/request-facts.ts).
        # $geoip2_* are declared http-wide in /etc/nginx/nginx.conf by the
        # ngx_http_geoip2 module against /usr/share/GeoIP/GeoLite2-City.mmdb.
        # The header NAMES are Cloudflare's on purpose: the pipeline is a port
        # of iq-rest's, which sits behind Cloudflare, and keeping the names
        # identical keeps it one codebase. proxy_set_header overwrites whatever
        # the client sent, so these cannot be spoofed.
        proxy_set_header cf-ipcountry $geoip2_country_code;
        proxy_set_header cf-ipcity $geoip2_city_name;
        proxy_set_header cf-region $geoip2_region_name;
        proxy_set_header cf-region-code $geoip2_region_code;
        proxy_cache_bypass $http_upgrade;
    }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.iq-translate.com;

    ssl_certificate /etc/letsencrypt/live/iq-translate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iq-translate.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://iq-translate.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name iq-translate.com www.iq-translate.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://iq-translate.com$request_uri; }
}

# Legacy domain (prod: /etc/nginx/sites-available/translator.conf) -> 301 to iq-translate.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name translate.iq-factura.com;

    ssl_certificate /etc/letsencrypt/live/translate.iq-factura.com/fullchain.pem;
