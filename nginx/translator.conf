    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://iq-translate.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name translate.iq-factura.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://iq-translate.com$request_uri; }
}
