name: Prod diagnostics (manual)
on:
  workflow_dispatch:
  # Also run when the marker file changes — the only way to trigger it from a
  # token without workflow-dispatch rights. Touch diag.txt to re-run.
  push:
    branches: [main]
    paths: ["diag.txt"]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only diagnostics over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "===== DATE (UTC) ====="
            date -u +"%Y-%m-%d %H:%M:%S UTC"
            echo "===== PM2 STATUS ====="
            pm2 status 2>&1 | head -40
            echo "===== translator (Next.js) last logs ====="
            pm2 logs translator --lines 200 --nostream 2>&1 | tail -n 260
            echo "===== translator-ocr (sidecar) last logs ====="
            pm2 logs translator-ocr --lines 200 --nostream 2>&1 | tail -n 260
            echo "===== OCR sidecar health ====="
            curl -s -m 5 http://127.0.0.1:8701/healthz || echo "healthz unreachable"
            echo "===== composed images on disk ====="
            find /home/deploy/apps/translator/var/translated -type f -printf "%T@ %p\n" 2>/dev/null | sort -rn | head -20
            echo "===== dejavu fonts present? ====="
            ls /usr/share/fonts/truetype/dejavu/ 2>/dev/null || fc-list 2>/dev/null | grep -ci dejavu || echo "no dejavu fonts"
